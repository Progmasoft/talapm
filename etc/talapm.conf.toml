# The configuration of TalaPM, installed as /etc/talapm.conf.toml. Files in
# /etc/talapm.d/ and -s on the command line override it; see the README.

[download]
parallel = 4
weak-deps = false
keep-cache = true
check-space = true
verbosity = "User-Friendly"

[signature]
level = ["Recommend", "Database"]

[color]
level = "Auto" # "Auto", "Always" or "Never"

[repo.built-in.core]
enabled = true

[repo.built-in.extra]
enabled = true

[repo.built-in.lib32]
enabled = false

[repo.built-in.nofree]
enabled = false

[repo.built-in.lib32nofree]
enabled = false

# A repository of your own, with its keyring in
# /etc/talapm.keyrings/repo/example.gpg:
# [repo.example]
# enabled = true
# mirror-uris = ["https://repo.example.org/"]
